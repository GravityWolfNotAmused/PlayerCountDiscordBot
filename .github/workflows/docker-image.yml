name: Docker Image CI

on:
  push:
    branches: [ "latest", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Get branch name
      id: branch-name
      uses: tj-actions/branch-names@v9.0.0
      
    - name: List files
      run: ls -la
      
    - name: Login
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
      
    - name: Build the Docker image
      run: docker build ./DiscordPlayerCountBot -t specker/discordplayercountbot:${{ steps.branch-name.outputs.current_branch }}
      
    - name: Push
      run: docker push ${{secrets.DOCKER_USER}}/discordplayercountbot:${{ steps.branch-name.outputs.current_branch }}
